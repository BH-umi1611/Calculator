<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1f2937;
      font-family: Arial, sans-serif;
    }
    .calculator {
      width: 300px;
      padding: 16px;
      background: #111827;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .display {
      background: #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      text-align: right;
      min-height: 80px;
    }
    .history { font-size: 14px; color: #6b7280; min-height: 20px; }
    .current { font-size: 32px; color: #111827; word-wrap: break-word; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button {
      padding: 16px 0;
      font-size: 20px;
      border: none;
      border-radius: 8px;
      background: #374151;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #4b5563; }
    button:active { transform: scale(0.95); }
    .op { background: #f59e0b; }
    .op:hover { background: #d97706; }
    .clear { background: #ef4444; }
    .clear:hover { background: #dc2626; }
    .equal { background: #10b981; grid-column: span 2; }
    .equal:hover { background: #059669; }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="history" id="history"></div>
      <div class="current" id="current">0</div>
    </div>
    <div class="buttons">
      <button class="clear" onclick="clearAll()">C</button>
      <button onclick="deleteLast()">⌫</button>
      <button onclick="percent()">%</button>
      <button class="op" onclick="chooseOperator('÷')">÷</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="op" onclick="chooseOperator('×')">×</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="op" onclick="chooseOperator('-')">−</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="op" onclick="chooseOperator('+')">+</button>

      <button onclick="appendNumber('0')">0</button>
      <button onclick="appendNumber('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let current = "0";     // number being typed
    let previous = "";     // first number
    let operator = "";     // chosen operator

    const currentEl = document.getElementById("current");
    const historyEl = document.getElementById("history");

    function updateDisplay() {
      currentEl.textContent = current;
      historyEl.textContent = previous ? previous + " " + operator : "";
    }

    function appendNumber(num) {
      if (num === "." && current.includes(".")) return;
      current = (current === "0" && num !== ".") ? num : current + num;
      updateDisplay();
    }

    function chooseOperator(op) {
      if (previous !== "") calculate();
      operator = op;
      previous = current;
      current = "0";
      updateDisplay();
    }

    function calculate() {
      if (previous === "" || operator === "") return;
      const a = parseFloat(previous);
      const b = parseFloat(current);
      let result;

      if (operator === "+") result = a + b;
      else if (operator === "-") result = a - b;
      else if (operator === "×") result = a * b;
      else if (operator === "÷") {
        if (b === 0) {
          current = "Cannot divide by 0";
          previous = "";
          operator = "";
          updateDisplay();
          return;
        }
        result = a / b;
      }

      current = String(Math.round(result * 1e10) / 1e10);
      previous = "";
      operator = "";
      updateDisplay();
    }

    function percent() {
      current = String(parseFloat(current) / 100);
      updateDisplay();
    }

    function deleteLast() {
      current = current.length > 1 && !isNaN(current) ? current.slice(0, -1) : "0";
      updateDisplay();
    }

    function clearAll() {
      current = "0";
      previous = "";
      operator = "";
      updateDisplay();
    }

    // Keyboard support
    document.addEventListener("keydown", function (e) {
      if (e.key >= "0" && e.key <= "9") appendNumber(e.key);
      else if (e.key === ".") appendNumber(".");
      else if (e.key === "+" || e.key === "-") chooseOperator(e.key);
      else if (e.key === "*") chooseOperator("×");
      else if (e.key === "/") chooseOperator("÷");
      else if (e.key === "Enter" || e.key === "=") calculate();
      else if (e.key === "Backspace") deleteLast();
      else if (e.key === "Escape") clearAll();
    });
  </script>
</body>
</html>
